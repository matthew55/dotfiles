# https://github.com/akinsho/dotfiles/blob/main/.config/kitty/kitty.conf
# https://paul-nameless.com/mastering-kitty.html
# https://github.com/p-kolacz/.dotfiles/tree/master/kitty/.config/kitty/colors
# https://github.com/kovidgoyal/kitty/issues/2238 (fzf + kitty icat)

# --( kittens ) --
# https://github.com/kovidgoyal/kitty/tree/master/kittens
# https://github.com/trygveaa/kitty-kitten-search
# https://github.com/muchzill4/kitty-session
# https://dev.to/dylanirlbeck/kitty-sessions-44j2 (blog)
# https://github.com/muchzill4/setup/blob/master/dotfiles/fish/.config/fish/functions/kt.fish
# https://github.com/ad-on-is/kittens
# https://github.com/guysherman/kittymux
# https://github.com/knubie/vim-kitty-navigator
# https://github.com/fretboardfreak/kitty-theme-changer
# https://github.com/kassio/dotfiles/tree/main/config/xdg/kitty/kitty_search

# Pywal support
include ~/.cache/wal/colors-kitty.conf

scrollback_lines 10000
scrollback_pager nvim -c "syntax on|set t_Co=256|set termguicolors|setlocal nomodifiable nonumber nolist showtabline=0 foldcolumn=0 ft=man|colorscheme habamax|hi Normal guifg=#bcbcbc guibg=NONE gui=NONE cterm=NONE" -c "autocmd VimEnter * cnoremap q q!|nnoremap q :q!<CR>|normal G" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
scrollback_pager_history_size 10

hide_window_decorations yes

confirm_os_window_close 0

tab_bar_edge top
tab_bar_style custom
tab_bar_min_tabs 1

background_opacity 0.7

notify_on_cmd_finish invisible 20

kitty_mod alt

map kitty_mod+shift+s show_scrollback
map kitty_mod+shift+j  change_font_size all +2.0
map kitty_mod+shift+k  change_font_size all -2.0

# Vim navigation
map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+u scroll_page_up
map kitty_mod+d scroll_page_down

# Tab navigation
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab

# Copy and Paste
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_clipboard

# ZSH functions 
# Press Ctrl+Shift+C to jump into your configs in a popup overlay
map kitty_mod+shift+c launch --type=overlay zsh -ic "vconf"

# Fonts
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
