# Define primary applications-cliphist
$terminal = kitty
$fileManager = thunar
$browser = zen-browser
$editor = nvim
$viewer = imv
$player = mpv

# Other vars
$cursorTheme = Windows-10
$cursorSize = 24

# Setup monitors
# monitor = , preferred, auto, 1
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

# Setup Pywal colors
source = ~/.cache/wal/colors-hyprland.conf

# Startup programs
exec-once = hyprpm reload -n
exec-once = waybar
exec-once = mako
exec-once = waypaper --restore
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = xhost +SI:localuser:root
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,gpg,pkcs11
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet
exec-once = awww-daemon
exec-once = udiskie
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = hyprctl setcursor $cursorTheme $cursorSize

# Window rules (Use hyprctl clients to view name & class)
windowrule {
    name = polkit-kde-float
    match:class = ^(org.kde.polkit-kde-authentication-agent-1)$
    float = on
    center = on
    pin = on
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

windowrule {
    name = satty
    match:class = com.gabm.satty
    float = on
    center = on
}

windowrule {
    name = wiremix
    match:class = wiremix
    float = on
    center = on
    size = (monitor_w*0.5) (monitor_h*0.5)
}

windowrule {
    name = Waypaper
    match:class = waypaper
    float = on
    center = on
    pin = off
}

windowrule {
    name = nwg-displays
    match:class = nwg-displays
    float = on
    center = on
}

windowrule {
    name = nmrs
    match:class = org.nmrs.ui
    float = on
    center = on
}

windowrule {
    name = Friends List
    match:class = steam
    float = on
    center = on
}

windowrule {
    name = gsimplecal
    match:class = gsimplecal
    float = true
    move = (cursor_x-(window_w*0.5)) (cursor_y+25)
    no_anim = true
}

windowrule {
    name = LiveSplit
    match:class = livesplit.exe
    float = on
    pin = on
    move = 100%, 0%
}

# Global Binds for LiveSplit
# Numpad 1: Start or Split
bind = , KP_End, exec, echo "startorsplit" | nc -N localhost 16834
# Numpad 2: Skip Split
bind = , KP_Down, exec, echo "skipsplit" | nc -N localhost 16834
# Numpad 3: Undo Split
bind = , KP_Next, exec, echo "undosplit" | nc -N localhost 16834
# Numpad 9: Reset
bind = , KP_Prior, exec, echo "reset" | nc -N localhost 16834


layerrule {
    name = rofi
    match:class = rofi
    blur = on
}

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
env = GDK_SCALE,2
env = XCURSOR_SIZE,32

# Input configuration
input {
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true
  }
}

# Gestures
# gestures {
#   workspace_swipe = true
#   workspace_swipe_fingers = 3
# }

# Look and feel
general {
  layout = master

  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = $color1 $color2 45deg
  col.inactive_border = $background
  allow_tearing = false
}

master {
    new_status = slave  
    new_on_top = true  
    orientation = left # Master on left, slaves on right
}

misc {
    focus_on_activate = true
}

# Plugins
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        skip_empty = true
        workspace_method = center center # [center/first] [workspace] e.g. first 1 or center m+1
    }
}

plugin {
    csgo-vulkan-fix {
        # Whether to fix the mouse position. A select few apps might be wonky with this.
        fix_mouse = true

        # Add apps with vkfix-app = initialClass, width, height
        vkfix-app = cs2, 1650, 1050
    }
}


# Setup workstation per monitor (used in system scripts)
env = WS_PER_MONITOR,9
plugin {
    split-monitor-workspaces {
        count = 9
        keep_focused = 0 # Set to 1 if you want the focus to stay on the monitor when moving windows
        enable_notifications = 0
        enable_persistent_workspaces = 0
    }
}

plugin {
    hyprglass {
        default_theme = dark
        default_preset = default

        brightness = 0.9                 # global override
        dark:brightness = 0.82           # built-in dark theme override
        light:adaptive_boost = 0.5       # built-in light theme override

        # Custom preset: shared + per-theme variants
        preset = name:clear, glass_opacity:0.8, blur_strength:1.5
        preset = name:clear:dark, brightness:0.7
        preset = name:clear:light, brightness:1.2
    }
}

windowrule {
    name = kitty
    match:class = kitty
    tag = +hyprglass_theme_light
}

# Setup keybinds
$mainMod = SUPER

# Easy to modify way to launch terminal applications
$termRun=$terminal -e

# Window controls
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod | SHIFT, H, movewindow, l
bind = $mainMod | SHIFT, L, movewindow, r
bind = $mainMod | SHIFT, K, exec, $HOME/.local/bin/move-wrap u r
bind = $mainMod | SHIFT, J, exec, $HOME/.local/bin/move-wrap d l

bind = $mainMod, right, split-workspace, r+1
bind = $mainMod, left, split-workspace, r-1
bind = $mainMod|ALT, J, exec, $HOME/.local/bin/cycle-workspaces cycle prev
bind = $mainMod|ALT, K, exec, $HOME/.local/bin/cycle-workspaces cycle next
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9

bind = $mainMod|ALT|CTRL, J, exec, $HOME/.local/bin/cycle-workspaces move prev
bind = $mainMod|ALT|CTRL, K, exec, $HOME/.local/bin/cycle-workspaces move next
bind = $mainMod|SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod|SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod|SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod|SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod|SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod|SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod|SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod|SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod|SHIFT, 9, split-movetoworkspace, 9

bind = $mainMod, period, focusmonitor, +1
bind = $mainMod, comma,  focusmonitor, -1
bind = $mainMod|ALT, period, focusmonitor, +1
bind = $mainMod|ALT, comma,  focusmonitor, -1
bind = $mainMod|SHIFT, period, movewindow, mon:+1
bind = $mainMod|SHIFT, comma,  movewindow, mon:-1
bind = $mainMod|ALT|CTRL, period, movewindow, mon:+1
bind = $mainMod|ALT|CTRL, comma,  movewindow, mon:+1

bind = $mainMod, Tab, cyclenext,
bind = $mainMod|SHIFT, Tab, cyclenext, prev
bind = $mainMod, SPACE, layoutmsg, swapwithmaster
bind = $mainMod, S, togglefloating
bind = $mainMod, S, pin
bind = $mainMod|SHIFT, A, togglefloating
bind = $mainMod|SHIFT, C, killactive
bind = $mainMod|SHIFT, Q, exit
bind = $mainMod, F, fullscreen

bind = $mainMod|CTRL, Escape, exec, $HOME/.local/bin/reload-hyprland

# Mouse binds
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse:274, togglefloating

# Plugins

# Hyprtasking
bind = SUPER, g, hyprexpo:expo, toggle
# bind = SUPER, X, hyprtasking:killhovered
#
# bind = SUPER, H, hyprtasking:move, left
# bind = SUPER, J, hyprtasking:move, down
# bind = SUPER, K, hyprtasking:move, up
# bind = SUPER, L, hyprtasking:move, right

# Volume and Media Control
bind = $mainMod, equal, exec, pamixer -i 5
bind = $mainMod, minus, exec, pamixer -d 5
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Applications
bind = $mainMod, DELETE, exec, wlogout -b 6
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, exec, $browser
bind = $mainMod, R, exec, $fileManager
bind = $mainMod, T, exec, keepassxc
bind = $mainMod|SHIFT, R, exec, $termRun htop 
bind = , Print, exec, grim -g "$(slurp -d)" -t ppm - | satty --filename - --output-filename ~/Pictures/screenshots/$(date '+%Y%m%d-%H:%M:%S').png
bind = $mainMod, C, exec, hyprpicker -a
bind = $mainMod, F9, exec, waypaper
bind = $mainMod, F12, exec, $termRun --class wiremix wiremix
bind = $mainMod|SHIFT, F12, exec, nwg-displays

# Rofi scripts
$rofiRun = $HOME/.local/bin/rofi/rofi-run
bind = $mainMod, P, exec, $rofiRun -show drun
bind = $mainMod|SHIFT, P, exec, rofi-arch-wiki-searcher
bind = $mainMod|SHIFT, F9, exec, $rofiRun -modi emoji -show emoji -kb-secondary-copy "" -kb-custom-1 Ctrl+c
bind = $mainMod, F11, exec, rofi-mount
bind = $mainMod|SHIFT, F11, exec, rofi-umount
bind = $mainMod|CTRL|SHIFT, P, exec, rofi-theme-selector && sed -i '/^[[:space:]]*\/\/.*@theme/d' $XDG_CONFIG_HOME/rofi/config.rasi
bind = $mainMod, V, exec, $rofiRun -modi clipboard:$HOME/.local/bin/rofi/rofi-cliphist-img -show clipboard -show-icons
bind = $mainMod|SHIFT, V, exec, $rofiRun -modi clipboard:$HOME/.local/bin/rofi/rofi-cliphist-img -show clipboard -show-icons | cliphist-delete
bind = $mainMod|SHIFT, KP_Prior, exec, wine $HOME/Games/n64/sm64/livesplit/LiveSplit.exe

# Files
bind = $mainMod|CTRL|SHIFT, E, exec, $termRun $editor $XDG_CONFIG_HOME/hypr/hyprland.conf 
bind = $mainMod|CTRL|SHIFT, W, exec, $termRun $editor $XDG_CONFIG_HOME/waybar/config.jsonc 
bind = $mainMod|CTRL|SHIFT, V, exec, $termRun $editor $XDG_CONFIG_HOME/nvim
bind = $mainMod|CTRL|SHIFT, L, exec, $termRun sudo $editor /usr/share/sddm/themes/sddm-astronaut-theme/metadata.desktop

# Environmental variables
# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum

# Windows theme
env = XCURSOR_THEME,$cursorTheme
env = XCURSOR_SIZE,$cursorSize
env = HYPRCURSOR_THEME,$cursorTheme
env = HYPRCURSOR_SIZE,$cursorSize

# Toolkit Backend Variablesn = "all"
#fullscreen
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
